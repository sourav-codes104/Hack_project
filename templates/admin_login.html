<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login - TravelMate</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800&display=swap" rel="stylesheet">
  <style>
    :root { --primary: #ea580c; --secondary: #1e293b; --bg-color: #f1f5f9; --surface: #ffffff; --border: #e2e8f0; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Inter', sans-serif; background: var(--secondary); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    
    .login-card { background: var(--surface); padding: 40px; border-radius: 8px; width: 100%; max-width: 400px; box-shadow: 0 20px 40px rgba(0,0,0,0.3); border-top: 4px solid var(--primary); }
    
    .logo { font-family: 'Playfair Display', serif; font-size: 28px; font-weight: 800; color: var(--primary); text-align: center; margin-bottom: 8px; }
    .logo span { color: var(--secondary); }
    
    .title { text-align: center; font-size: 14px; font-weight: 600; color: #64748b; margin-bottom: 30px; text-transform: uppercase; letter-spacing: 1px; }

    .flash { background: #fee2e2; border: 1px solid #fecaca; color: #e11d48; padding: 12px; border-radius: 4px; font-size: 14px; margin-bottom: 20px; text-align: center; font-weight: 500; }

    .form-group { margin-bottom: 20px; }
    label { display: block; font-size: 13px; font-weight: 600; color: #334155; margin-bottom: 8px; }
    input { width: 100%; padding: 12px 16px; border: 1px solid var(--border); border-radius: 4px; font-family: 'Inter'; font-size: 15px; outline: none; transition: 0.2s; }
    input:focus { border-color: var(--primary); }

    .btn { width: 100%; padding: 14px; background: var(--secondary); color: white; border: none; border-radius: 4px; font-weight: 600; font-size: 16px; cursor: pointer; transition: 0.2s; margin-top: 10px; }
    .btn:hover { background: #0f172a; }

    .back { text-align: center; margin-top: 24px; font-size: 14px; }
    .back a { color: #64748b; text-decoration: none; font-weight: 500; }
    .back a:hover { color: var(--primary); }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="logo">Travel<span>Mate</span></div>
    <div class="title">Secure Admin Portal</div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, msg in messages %}
          <div class="flash">{{ msg }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('admin_login') }}">
      <div class="form-group">
        <label>Admin Username</label>
        <input type="text" name="username" required>
      </div>
      <div class="form-group">
        <label>Passcode</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="btn">Authenticate</button>
    </form>

    <div class="back"><a href="/">← Return to Public Site</a></div>
  </div>
</body>
</html>
