<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Dashboard — AI TravelMate</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
       background: url("{{ url_for('static', filename='css/css8.jpg') }}") no-repeat center center fixed;
      background-size: cover;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }

    

    /* Animated background elements */
    body::before {
      content: '';
      position: absolute;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 70%);
      top: -200px;
      right: -200px;
      border-radius: 50%;
      animation: float 15s ease-in-out infinite;
    }

    body::after {
      content: '';
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.15) 0%, transparent 70%);
      bottom: -150px;
      left: -150px;
      border-radius: 50%;
      animation: float 12s ease-in-out infinite reverse;
    }

    @keyframes float {
      0%, 100% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(50px, 50px) scale(1.1); }
    }

    .dashboard-container {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 480px;
      padding: 20px;
    }

    .dashboard {
      background: rgba(42, 54, 71, 0.85);
      backdrop-filter: blur(20px);
      padding: 48px 40px;
      border-radius: 24px;
      box-shadow: 
        0 20px 60px rgba(0, 0, 0, 0.4),
        0 0 0 1px rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.08);
      transition: all 0.4s ease;
    }

    .dashboard:hover {
      transform: translateY(-8px);
      box-shadow: 
        0 30px 80px rgba(0, 0, 0, 0.5),
        0 0 0 1px rgba(255, 255, 255, 0.15);
    }

    .header-section {
      text-align: center;
      margin-bottom: 36px;
    }

    .icon-wrapper {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      border-radius: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .icon-wrapper svg {
      width: 40px;
      height: 40px;
      stroke: white;
      stroke-width: 2;
      fill: none;
    }

    h1 {
      color: #ffffff;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: rgba(255, 255, 255, 0.6);
      font-size: 15px;
      font-weight: 400;
      margin-bottom: 32px;
      line-height: 1.5;
    }

    .input-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      color: rgba(255, 255, 255, 0.8);
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
    }

    input, select {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: #ffffff;
      font-size: 15px;
      outline: none;
      transition: all 0.3s ease;
      font-family: 'Inter', sans-serif;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    input:focus, select:focus {
      background: rgba(255, 255, 255, 0.08);
      border-color: #6366f1;
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }

    select {
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='white' stroke-opacity='0.6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 16px center;
      padding-right: 40px;
    }

    select option {
      background: #2a3647;
      color: white;
    }

    button {
      width: 100%;
      background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 100%);
      color: white;
      padding: 14px 20px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-size: 16px;
      font-weight: 600;
      transition: all 0.3s ease;
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.3);
      margin-top: 24px;
    }

    button:hover {
      background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(99, 102, 241, 0.4);
    }

    .links-section {
      margin-top: 32px;
      padding-top: 24px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .link-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      transition: all 0.3s ease;
      text-decoration: none;
      color: rgba(255, 255, 255, 0.8);
      font-size: 14px;
      font-weight: 500;
    }

    .link-item:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(99, 102, 241, 0.3);
      color: #ffffff;
      transform: translateX(4px);
    }

    .brand-logo {
      position: absolute;
      top: 32px;
      left: 32px;
      z-index: 3;
    }

    .brand-logo h2 {
      font-size: 24px;
      font-weight: 700;
      color: white;
    }

    .brand-logo span:first-child {
      color: #8b5cf6;
    }

    .brand-logo span:last-child {
      color: white;
    }
  </style>
</head>
<body>
  <div class="brand-logo">
    <h2><span>AI</span> <span>TravelMate</span></h2>
  </div>

  <div class="dashboard-container">
    <div class="dashboard">
      <div class="header-section">
        <div class="icon-wrapper">
          <svg viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </div>
        <h1>Welcome, Traveler! 👋</h1>
        <p class="subtitle">Get personalized travel suggestions and discover amazing destinations</p>
      </div>

      <form method="POST" action="{{ url_for('recommend') }}">
        <div class="input-group">
          <label for="location">Enter City</label>
          <input type="text" id="location" name="location" placeholder="e.g. Indore, Mumbai, Paris" required>
        </div>

        <div class="input-group">
          <label for="interest">Your Interests</label>
          <input type="text" id="interest" name="interest" placeholder="Nature, Heritage, Food, Adventure">
        </div>

        <div class="input-group">
          <label for="budget">Travel Budget</label>
          <select id="budget" name="budget">
            <option value="low">Low Budget</option>
            <option value="medium">Medium Budget</option>
            <option value="high">High Budget</option>
          </select>
        </div>

        <button type="submit">Get Recommendations</button>
      </form>

      <div class="links-section">
        <a href="{{ url_for('chat_page') }}" class="link-item">
          <span class="link-icon">💬</span>
          <span>Chat with AI Assistant</span>
        </a>
        <a href="{{ url_for('home') }}" class="link-item">
          <span class="link-icon">🏠</span>
          <span>Back to Home</span>
        </a>
      </div>
    </div>
  </div>
</body>
</html>
