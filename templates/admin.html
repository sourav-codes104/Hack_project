<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard - AI TravelMate</title>
  <style>
    body {
      font-family: "Poppins", sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      text-align: center;
      padding: 40px;
      min-height: 100vh;
    }

    h1 {
      color: #f472b6;
      font-size: 2.2rem;
      margin-bottom: 10px;
    }

    p {
      color: #94a3b8;
      margin-bottom: 20px;
    }

    table {
      margin: 0 auto;
      width: 80%;
      border-collapse: collapse;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }

    th, td {
      padding: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    th {
      background: rgba(255,255,255,0.1);
      color: #f9a8d4;
      font-weight: 600;
    }

    tr:hover {
      background: rgba(255,255,255,0.08);
    }

    .logout {
      display: inline-block;
      margin-top: 30px;
      background: linear-gradient(135deg, #f472b6, #be185d);
      color: white;
      text-decoration: none;
      padding: 10px 20px;
      border-radius: 8px;
      transition: 0.3s;
    }

    .logout:hover {
      background: linear-gradient(135deg, #ec4899, #9d174d);
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <h1>Welcome, Admin 👑</h1>
  <p>Here’s your dashboard — manage feedback and insights below.</p>

  <table>
    <tr>
      <th>Name</th>
      <th>Email</th>
      <th>Message</th>
      <th>Date</th>
    </tr>
    {% for f in feedbacks %}
    <tr>
      <td>{{ f[0] }}</td>
      <td>{{ f[1] }}</td>
      <td>{{ f[2] }}</td>
      <td>{{ f[3] }}</td>
    </tr>
    {% else %}
    <tr><td colspan="4">No feedback available 😔</td></tr>
    {% endfor %}
  </table>

  <a href="{{ url_for('admin_logout') }}" class="logout">Logout</a>
</body>
</html>
